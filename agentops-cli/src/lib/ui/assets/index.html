<!doctype html>
<html lang="en">
<head>

<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1016" media="(prefers-color-scheme: dark)">
<title>AgentOps · Runs</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">

<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar">
  <a class="brand" href="#/" aria-label="AgentOps runs home">
    <img src="/assets/favicon.svg" alt="" width="22" height="22">
    <span class="brand-name">AgentOps</span>
    <span class="brand-scope">Local</span>
  </a>
  <div class="topbar-right">
    <span class="privacy-chip" id="privacy-chip" title="Only metadata (names, timings, counts) is served. Prompts, arguments and results never leave the session files.">
      <svg aria-hidden="true" viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M8 1a3.5 3.5 0 0 0-3.5 3.5V6H4a1.5 1.5 0 0 0-1.5 1.5v6A1.5 1.5 0 0 0 4 15h8a1.5 1.5 0 0 0 1.5-1.5v-6A1.5 1.5 0 0 0 12 6h-.5V4.5A3.5 3.5 0 0 0 8 1Zm2 5H6V4.5a2 2 0 1 1 4 0V6Z"/></svg>
      <span id="privacy-label">Metadata only</span>
    </span>
    <button type="button" class="icon-button" id="theme-toggle" aria-label="Theme: system" title="Theme: system (press t)">
      <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16"><path fill="currentColor" d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM8 3v10a5 5 0 0 1 0-10Z"/></svg>
    </button>
  </div>
</header>
<main id="main" tabindex="-1">
  <p class="loading" role="status">Loading runs…</p>
</main>
<div class="sr-only" aria-live="polite" id="announcer"></div>
<noscript><p class="noscript">AgentOps Local needs JavaScript enabled. It runs only on this machine.</p></noscript>
</body>
</html>
