# AgentOps strict privacy allowlist fragment.
# This is a source-controlled contract for the collector configs generated in
# collector/otelcol.*.strict.yaml. Keep it metadata-only.
processors:
  transform/privacy_strict:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name","service.namespace","service.version","telemetry.sdk.name","telemetry.sdk.language","telemetry.sdk.version","agent.framework","agent.runtime","agentops.profile","agentops.experiment","agentops.e2e.id","agentops.pack.version","agentops.repo.hash","agentops.branch.hash","agentops.workspace.hash","agentops.surface","agentops.privacy.mode","agentops.content_capture.mode","agentops.content_capture.signal","agentops.poison_id","agentops.run.id","agentops.session.id","agentops.script.runtime.name","agentops.script.runtime.version","agentops.script.runtime.implementation","agentops.script.loader.name"])
      - context: span
        statements:
          # model-provider-guard: drop model/provider values that are not plain identifiers (URLs, key=value, credentials).
          - delete_key(attributes, "gen_ai.request.model") where attributes["gen_ai.request.model"] != nil and (not IsMatch(attributes["gen_ai.request.model"], "^[A-Za-z0-9][A-Za-z0-9._:+/-]{0,127}$") or IsMatch(attributes["gen_ai.request.model"], "//|(?i)(api[_-]?key|token|secret|password|bearer|sig=)"))
          - delete_key(attributes, "gen_ai.response.model") where attributes["gen_ai.response.model"] != nil and (not IsMatch(attributes["gen_ai.response.model"], "^[A-Za-z0-9][A-Za-z0-9._:+/-]{0,127}$") or IsMatch(attributes["gen_ai.response.model"], "//|(?i)(api[_-]?key|token|secret|password|bearer|sig=)"))
          - delete_key(attributes, "agentops.model.requested") where attributes["agentops.model.requested"] != nil and (not IsMatch(attributes["agentops.model.requested"], "^[A-Za-z0-9][A-Za-z0-9._:+/-]{0,127}$") or IsMatch(attributes["agentops.model.requested"], "//|(?i)(api[_-]?key|token|secret|password|bearer|sig=)"))
          - delete_key(attributes, "agentops.model.actual") where attributes["agentops.model.actual"] != nil and (not IsMatch(attributes["agentops.model.actual"], "^[A-Za-z0-9][A-Za-z0-9._:+/-]{0,127}$") or IsMatch(attributes["agentops.model.actual"], "//|(?i)(api[_-]?key|token|secret|password|bearer|sig=)"))
          - delete_key(attributes, "gen_ai.provider.name") where attributes["gen_ai.provider.name"] != nil and (not IsMatch(attributes["gen_ai.provider.name"], "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$") or IsMatch(attributes["gen_ai.provider.name"], "//|(?i)(api[_-]?key|token|secret|password|bearer|sig=)"))
          - keep_keys(attributes, ["agentops.schema.version","agentops.run.id","agentops.session.id","agentops.surface","agentops.privacy.mode","agentops.content_capture.mode","agentops.content_capture.signal","agentops.custom_event_id","agentops.parent_event_id","agentops.event.sequence","agentops.command.name","agentops.script.name","agentops.event.name","agentops.repo.hash","agentops.branch.hash","agentops.workspace.hash","agentops.command.hash","agentops.task.type","agentops.agent.name","agentops.agent.hash","agentops.parent_agent.name","agentops.sub_agent.name","agentops.delegation.id","agentops.subagent.duration_ms","agentops.subagent.total_tokens","agentops.subagent.tool_count","agentops.skill.name","agentops.skill.hash","agentops.workflow.name","agentops.step.name","agentops.outcome","agentops.model.requested","agentops.model.actual","agentops.outcome.status","agentops.outcome.reason","agentops.duration.ms","agentops.error.type","agentops.retry.count","agentops.tools.count","agentops.tools.failed_count","agentops.tools.denied_count","agentops.tests.ran","agentops.tests.passed","agentops.tests.command_hash","agentops.files.read_count","agentops.files.edited_count","agentops.files.sensitive_touched","agentops.pr.opened","agentops.pr.number_hash","agentops.ci.status","agentops.cost.estimated_usd","agentops.risk.score","agentops.eval.overall","agentops.mcp.server","agentops.mcp.tool","agentops.mcp.server.hash","agentops.mcp.allowed","agentops.mcp.tool.risk","gen_ai.operation.name","gen_ai.provider.name","gen_ai.conversation.id","gen_ai.request.model","gen_ai.response.model","gen_ai.usage.input_tokens","gen_ai.usage.output_tokens","gen_ai.usage.reasoning.output_tokens","gen_ai.tool.name","gen_ai.tool.type","gen_ai.tool.call.id","mcp.method.name","mcp.session.id","mcp.transport","mcp.server.name","mcp.client.name","error.type","server.address","http.status_code","agentops.poison_id","agentops.api.duration_ms","agentops.content.action","agentops.content.dropped_bytes","agentops.content.kind","agentops.content.secret_like","agentops.error.size_bytes","agentops.lines.added","agentops.lines.removed","agentops.permission.decision","agentops.permission.kind","agentops.prompt.hash","agentops.prompt.size_bytes","agentops.tool.args_schema_hash","agentops.tool.args_size_bytes","agentops.tool.result_size_bytes","gen_ai.usage.cache_creation.input_tokens","gen_ai.usage.cache_read.input_tokens","gen_ai.usage.total_tokens","github.copilot.aiu.nano","github.copilot.cost","github.copilot.premium_requests","agentops.script.runtime.name","agentops.script.runtime.version","agentops.script.runtime.implementation","agentops.script.loader.name","agentops.outcome.source","agentops.script.observer.role","agentops.script.observer.pid","agentops.script.child.pid","process.exit.code","process.signal.number"])
      - context: spanevent
        statements:
          - keep_keys(attributes, ["agentops.content_capture.signal", "agentops.run.id", "agentops.session.id", "agentops.event.name", "agentops.agent.name", "agentops.skill.name", "agentops.mcp.server", "agentops.mcp.tool", "agentops.poison_id", "gen_ai.operation.name", "gen_ai.tool.name", "mcp.method.name", "error.type", "exception.type"])
