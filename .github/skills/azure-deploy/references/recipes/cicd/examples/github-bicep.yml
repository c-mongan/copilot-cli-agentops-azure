# Manual, approval-gated example: run what-if/preview, review it, then apply. Never auto-deploy on push.
name: Deploy Infrastructure

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment so the apply step waits for approval.
    environment: production
    permissions:
      id-token: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if (review before apply)
        run: |
          az deployment sub what-if \
            --location eastus \
            --template-file ./infra/main.bicep \
            --parameters environmentName=${{ vars.ENVIRONMENT }}

      - uses: azure/arm-deploy@v2
        with:
          scope: subscription
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          region: eastus
          template: ./infra/main.bicep
          parameters: environmentName=${{ vars.ENVIRONMENT }}
