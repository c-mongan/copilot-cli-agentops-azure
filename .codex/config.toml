[mcp_servers.azure-mcp]
command = "npx"
args = ["-y", "@azure/mcp@latest", "server", "start", "--read-only", "--namespace", "monitor", "--namespace", "applicationinsights", "--namespace", "workbooks", "--namespace", "grafana", "--namespace", "kusto", "--namespace", "group", "--namespace", "subscription", "--namespace", "role", "--namespace", "pricing", "--namespace", "bicepschema"]
startup_timeout_sec = 40

[mcp_servers.microsoft-learn]
url = "https://learn.microsoft.com/api/mcp"

[mcp_servers.context7-http]
url = "https://mcp.context7.com/mcp/oauth"

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest", "--headless", "--isolated"]
startup_timeout_sec = 40
